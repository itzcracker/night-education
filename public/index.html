<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nightfall</title><style>:root{color-scheme:dark;--bg:#141414;--panel:#1f1f1f;--panel2:#292929;--line:#343434;--text:#f4f4f4;--muted:#999;--blue:#55a9ff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input{font:inherit;color:inherit}button{border:0;cursor:pointer}.app{height:100%;display:flex;overflow:hidden}.rail{width:58px;flex:none;background:#101010;border-right:1px solid #262626;display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:14px}.rail button{width:42px;height:42px;border-radius:10px;background:transparent;color:#999;display:grid;place-items:center}.rail button:hover,.rail button.active{background:#292929;color:#fff}.rail svg{width:21px;height:21px;fill:currentColor;stroke:currentColor;stroke-width:1.5}.bottom{margin-top:auto}.workspace{min-width:0;flex:1;display:flex;flex-direction:column}.browser{height:86px;background:#101010;border-bottom:1px solid #282828}.tabs{height:40px;display:flex;gap:3px;padding-left:10px}.tab{min-width:142px;max-width:220px;padding:0 14px;display:flex;align-items:center;gap:10px;background:#171717;color:#898989;border-radius:8px 8px 0 0}.tab.active{background:#242424;color:#eee}.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.tab button{background:none;color:#777}.newtab{padding:0 14px;background:none;color:#aaa;font-size:20px}.address{height:46px;display:flex;align-items:center;gap:14px;padding:0 12px}.controls{display:flex;gap:16px;color:#888;font-size:20px}.controls button{background:none}.addressbar{height:32px;flex:1;border:1px solid #2e2e2e;border-radius:8px;background:#1a1a1a;color:#cfcfcf;padding:7px 12px;font-size:13px}.content{flex:1;overflow:auto;padding:20px clamp(18px,5vw,72px) 36px}.search{display:block;width:min(500px,100%);margin:0 auto 30px;border:0;border-radius:24px;background:#2b2b2b;padding:14px 22px;outline:0}.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}.card{overflow:hidden;text-align:left;border-radius:8px;background:#202020;padding:0;transition:.18s}.card:hover{transform:translateY(-3px);background:#292929}.cover{width:100%;aspect-ratio:1.42;display:block;object-fit:cover;background:#292929}.card h2{font-size:15px;margin:11px 12px 14px}.empty,.status{max-width:720px;margin:80px auto;color:var(--muted);text-align:center}.ai{max-width:720px;min-height:620px;margin:auto;background:#111;border:1px solid #333;border-radius:10px;display:flex;flex-direction:column}.agents{display:flex;gap:8px;padding:14px;border-bottom:1px solid #292929;flex-wrap:wrap}.agents button{background:#222;border:1px solid #333;border-radius:7px;padding:8px 10px;color:#aaa}.agents button.active{background:#333;color:#fff;border-color:#555}.messages{flex:1;overflow:auto;padding:18px}.message{max-width:90%;margin:0 0 12px;padding:11px 13px;border-radius:9px;background:#202020;white-space:pre-wrap;line-height:1.55}.message.you{margin-left:auto;background:#2b4c72}.message strong{color:#fff}.composer{display:flex;gap:10px;padding:14px;border-top:1px solid #292929}.composer input{min-width:0;flex:1;background:#191919;border:1px solid #3a3a3a;border-radius:7px;padding:12px}.composer button{background:#fff;color:#111;border-radius:6px;padding:0 20px;font-weight:700}.gameview{max-width:1200px;margin:auto}.gamebar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.gamebar strong{margin-right:auto}.gamebar button{background:#292929;padding:8px 12px;border-radius:6px}.framewrap{position:relative;aspect-ratio:16/9;background:#000}.framewrap iframe{width:100%;height:100%;border:0}.online{position:fixed;right:15px;bottom:10px;background:#202020;border:1px solid #333;border-radius:8px;padding:7px 12px;color:#aaa}@media(max-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.browser{height:74px}.tab{min-width:120px}.content{padding:16px}.rail{width:50px}.ai{min-height:calc(100vh - 110px)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head><body><div class="app"><aside class="rail"><button class="active" data-view="games" aria-label="Games"><svg viewBox="0 0 640 512"><path d="M192 64C86 64 0 150 0 256s86 192 192 192h256c106 0 192-86 192-192S554 64 448 64H192zm-24 136v32h32c13 0 24 11 24 24s-11 24-24 24h-32v32c0 13-11 24-24 24s-24-11-24-24v-32H88c-13 0-24-11-24-24s11-24 24-24h32v-32c0-13 11-24 24-24s24 11 24 24z"/></svg></button><button data-view="ai" aria-label="AI agents"><svg viewBox="0 0 512 512"><path d="M256 0c14 0 26 9 30 22l22 68 68 22c13 4 22 16 22 30s-9 26-22 30l-68 22-22 68c-4 13-16 22-30 22s-26-9-30-22l-22-68-68-22c-13-4-22-16-22-30s9-26 22-30l68-22 22-68C230 9 242 0 256 0z"/></svg></button><button data-view="web" aria-label="Web proxy"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="3"/><path d="M3 24h42M24 3a21 21 0 0 1 0 42M24 3a21 21 0 0 0 0 42" fill="none" stroke="currentColor" stroke-width="3"/></svg></button><button class="bottom" aria-label="Settings"><svg viewBox="0 0 416 432"><path d="m366 237 45 35q7 6 3 14l-43 74q-4 8-13 4l-53-21q-18 13-36 21l-8 56q-1 9-11 9h-85q-9 0-11-9l-8-56q-19-8-36-21l-53 21q-9 3-13-4L1 286q-4-8 3-14l45-35q-1-12-1-21t1-21L4 160q-7-6-3-14l43-74q5-8 13-4l53 21q18-13 36-21l8-56q2-9 11-9h85q10 0 11 9l8 56q19 8 36 21l53-21q9-4 13 4l43 74q4 8-3 14l-45 35q2 12 2 21t-2 21zM208 291q31 0 53-22t22-53-22-53-53-22-53 22-22 53 22 53 53 22z"/></svg></button></aside><main class="workspace"><header class="browser"><div class="tabs" id="tabs"><button class="tab active"><span>Nightfall Games</span></button><button class="newtab" id="newtab">+</button></div><div class="address"><div class="controls"><button id="back">‹</button><button id="forward">›</button><button id="reload">↻</button></div><div class="addressbar" id="address">nightfall.site/games</div></div></header><section class="content" id="content"></section></main></div><div class="online">167 online</div><script>
const MODELS=['recursive/flint-v1.0:free','dots-studio/dots-3-note-preview:free','liquid/lfm-2.5-2.6b:free','nvidia/nemotron-3.5-super-vl:free'];const modelNames={'recursive/flint-v1.0:free':'Flint','dots-studio/dots-3-note-preview:free':'Dots','liquid/lfm-2.5-2.6b:free':'Liquid','nvidia/nemotron-3.5-super-vl:free':'Nemotron'};const state={games:[],tabs:[{id:'home',title:'Nightfall Games',kind:'home'}],active:'home',model:MODELS[0],messages:[]};const content=document.querySelector('#content'),tabs=document.querySelector('#tabs'),address=document.querySelector('#address');function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function md(v){return esc(v).replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}function renderTabs(){tabs.querySelectorAll('.tab').forEach(e=>e.remove());state.tabs.forEach(t=>{const b=document.createElement('button');b.className='tab '+(t.id===state.active?'active':'');b.innerHTML='<span>'+esc(t.title)+'</span>'+(t.id==='home'?'':'<button aria-label="Close">×</button>');b.onclick=e=>e.target.tagName==='BUTTON'&&t.id!=='home'?(state.tabs=state.tabs.filter(x=>x.id!==t.id),state.active='home',render()):(state.active=t.id,render());tabs.insertBefore(b,document.querySelector('#newtab'))})}function renderHome(){content.innerHTML='<input class="search" id="search" placeholder="Search games..." aria-label="Search games"><div class="grid" id="grid"></div>';const paint=()=>{const q=document.querySelector('#search').value.toLowerCase();const list=state.games.filter(g=>g.title.toLowerCase().includes(q));document.querySelector('#grid').innerHTML=list.map(g=>'<button class="card" data-game="'+esc(g.slug)+'"><img class="cover" loading="lazy" src="/covers/'+esc(g.cover)+'" alt=""><h2>'+esc(g.title)+'</h2></button>').join('')||'<p class="empty">No games match that search.</p>';document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>openGame(b.dataset.game))};document.querySelector('#search').oninput=paint;paint()}function openGame(slug){const g=state.games.find(x=>x.slug===slug);const id='game-'+slug;state.tabs.push({id,title:g.title,kind:'game',slug});state.active=id;render()}function renderGame(t){content.innerHTML='<div class="gameview"><div class="gamebar"><strong>'+esc(t.title)+'</strong><button id="game-reload">Reload</button><button id="game-full">Fullscreen</button></div><div class="framewrap"><iframe id="game-frame" src="/games/'+encodeURIComponent(t.slug)+'.html" title="'+esc(t.title)+'"></iframe></div></div>';const f=document.querySelector('#game-frame');document.querySelector('#game-reload').onclick=()=>f.src=f.src;document.querySelector('#game-full').onclick=()=>f.requestFullscreen?.();address.textContent='nightfall.site/games/'+t.slug}async function ask(text,box,answer){const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:state.model,messages:state.messages})});if(!response.ok){const data=await response.json().catch(()=>({}));answer.innerHTML='<strong>'+esc(data.error||'Unable to contact Night AI.')+'</strong>';return}const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const lines=buffer.split('\n');buffer=lines.pop()||'';for(const line of lines){if(line.startsWith('event: model'))continue;if(!line.startsWith('data: '))continue;const payload=line.slice(6).trim();if(payload==='[DONE]')continue;try{const data=JSON.parse(payload);if(data.model){answer.dataset.model=data.model;answer.innerHTML='<small>Answered by '+esc(modelNames[data.model]||data.model)+(data.fallback?' (fallback)':'')+'</small><br>';continue}if(data.token){answer.innerHTML='<small>Answered by '+esc(modelNames[answer.dataset.model]||answer.dataset.model||state.model)+'</small><br>'+md((answer.dataset.raw||'')+data.token);answer.dataset.raw=(answer.dataset.raw||'')+data.token;box.scrollTop=box.scrollHeight}}catch{}}}}function renderAI(){content.innerHTML='<div class="ai"><div class="agents">'+MODELS.map(m=>'<button class="'+(m===state.model?'active':'')+'" data-model="'+m+'">'+modelNames[m]+'</button>').join('')+'</div><div class="messages" id="messages"><div class="message">Night AI is ready. Choose a model and ask anything.</div></div><form class="composer" id="composer"><input id="prompt" placeholder="Type your message here..." autocomplete="off"><button>Send</button></form></div>';document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{state.model=b.dataset.model;renderAI()});document.querySelector('#composer').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('#prompt'),text=input.value.trim();if(!text)return;state.messages.push({role:'user',content:text});const box=document.querySelector('#messages');box.insertAdjacentHTML('beforeend','<div class="message you">'+esc(text)+'</div>');const answer=document.createElement('div');answer.className='message';answer.textContent='Thinking...';box.append(answer);input.value='';await ask(text,box,answer);state.messages.push({role:'assistant',content:answer.dataset.raw||answer.textContent||''})}}function renderWeb(){content.innerHTML='<div class="status">Web proxy is ready for the local Scramjet/Wisp configuration.</div>'}function render(){renderTabs();const t=state.tabs.find(x=>x.id===state.active);document.querySelectorAll('.rail button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===(t?.kind==='ai'?'ai':t?.kind==='web'?'web':'games')));if(t?.kind==='game')renderGame(t);else if(t?.kind==='ai')renderAI();else if(t?.kind==='web')renderWeb();else renderHome()}document.querySelector('#newtab').onclick=()=>{state.active='home';render()};document.querySelector('#reload').onclick=render;document.querySelectorAll('.rail button[data-view]').forEach(b=>b.onclick=()=>{const kind=b.dataset.view;if(kind==='games'){state.active='home'}else{const id=kind+'-'+Date.now();state.tabs.push({id,title:kind==='ai'?'AI Agents':'Web',kind});state.active=id}render()});render();fetch('/games.json').then(r=>r.json()).then(g=>{state.games=g;render()}).catch(()=>content.innerHTML='<p class="status">Could not load games.json.</p>');
</script></body></html>
