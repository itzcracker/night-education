<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Night Education</title>
  <link id="site-favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b1714'/%3E%3Cpath d='M42 11a23 23 0 1 0 11 39A22 22 0 0 1 42 11Z' fill='%2397f6c1'/%3E%3C/svg%3E">
  <style>
    :root{--bg:#07100e;--panel:#0c1815;--panel2:#11221d;--line:#1e392f;--text:#e9fff1;--muted:#91aa9e;--fern:#9af6c0;--fern2:#4ed98d;--danger:#ffb4a6;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{overflow:hidden}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;background:radial-gradient(circle at 75% 8%,#173a2c 0,transparent 26%),radial-gradient(circle at 20% 90%,#10281f 0,transparent 30%),var(--bg);position:relative}.app:before{content:"";position:fixed;inset:-30%;opacity:.23;background-image:linear-gradient(115deg,transparent 45%,#5ee99a 46%,transparent 47%),linear-gradient(35deg,transparent 45%,#5ee99a 46%,transparent 47%);background-size:190px 170px;filter:blur(34px);animation:drift 20s linear infinite;pointer-events:none}@keyframes drift{to{transform:translate(90px,50px) rotate(3deg)}}.sidebar{width:258px;border-right:1px solid var(--line);background:#091511d9;backdrop-filter:blur(20px);padding:24px 16px;display:flex;flex-direction:column;position:relative;z-index:1}.brand{display:flex;align-items:center;gap:12px;padding:0 10px 30px}.mark{height:36px;width:36px;border-radius:12px;background:linear-gradient(135deg,var(--fern),#3fae76);position:relative;box-shadow:0 0 28px #63e9a74d}.mark:after{content:"";position:absolute;width:17px;height:22px;left:11px;top:7px;border-radius:100% 0 100% 0;background:#0b1913;transform:rotate(35deg)}.brand strong{font-size:18px;letter-spacing:-.03em}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:var(--muted);display:flex;align-items:center;gap:13px;text-align:left;padding:12px 13px;border-radius:12px;transition:.2s}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--fern)}.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}.side-note{margin-top:auto;padding:15px;color:var(--muted);font-size:12px;line-height:1.5;border:1px solid var(--line);border-radius:14px;background:#0d1d18b0}.main{flex:1;min-width:0;position:relative;z-index:1;display:flex;flex-direction:column}.topbar{height:76px;border-bottom:1px solid #1a3028;display:flex;align-items:center;justify-content:space-between;padding:0 34px}.crumb{color:var(--muted);font-size:13px}.clock{color:var(--fern);font-variant-numeric:tabular-nums;font-size:13px}.view{padding:42px clamp(24px,5vw,72px);overflow:auto;height:calc(100vh - 76px)}.hero{max-width:760px;margin:4vh auto 0;text-align:center}.eyebrow{color:var(--fern);font-size:12px;text-transform:uppercase;letter-spacing:.2em}.hero h1{font-size:clamp(42px,7vw,84px);line-height:.98;letter-spacing:-.07em;margin:18px 0 18px}.hero p{color:var(--muted);max-width:490px;margin:0 auto 30px;line-height:1.7}.search{display:flex;align-items:center;gap:12px;max-width:620px;margin:auto;border:1px solid #335d4a;background:#0e211a;border-radius:16px;padding:5px 7px 5px 17px;box-shadow:0 14px 55px #00000035}.search svg{width:19px;color:var(--fern);fill:none;stroke:currentColor;stroke-width:1.8}.search input{flex:1;background:transparent;border:0;outline:0;color:var(--text);min-width:0;padding:12px 0}.search button,.primary{border:0;border-radius:11px;background:var(--fern);color:#082116;padding:11px 16px;font-weight:700}.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:23px}.section-head h2{margin:0;font-size:30px;letter-spacing:-.04em}.section-head p{margin:5px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:17px}.card{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#0d1b17;transition:transform .2s,border-color .2s;cursor:pointer}.card:hover{transform:translateY(-4px);border-color:#5ac88c}.card img{display:block;width:100%;aspect-ratio:1.32;object-fit:cover;background:#132b22}.card-body{padding:13px}.card-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-meta{font-size:11px;color:var(--muted);margin-top:5px}.form-panel{max-width:760px;border:1px solid var(--line);background:#0d1b17cc;border-radius:18px;padding:24px}.label{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}.field{width:100%;border:1px solid var(--line);background:#091511;color:var(--text);border-radius:11px;padding:13px;outline:0}.field:focus{border-color:var(--fern)}.row{display:flex;gap:10px;flex-wrap:wrap}.chat{height:calc(100vh - 170px);display:flex;flex-direction:column;max-width:880px}.messages{flex:1;overflow:auto;display:grid;align-content:start;gap:13px;padding:4px}.bubble{max-width:78%;padding:13px 15px;border-radius:14px;line-height:1.55;white-space:pre-wrap}.bubble.ai{background:var(--panel2);border:1px solid var(--line)}.bubble.me{background:#2e8158;margin-left:auto;color:#f1fff5}.composer{display:flex;gap:10px;margin-top:16px}.composer textarea{resize:none;min-height:48px}.fullscreen{position:fixed;inset:0;background:#040907;z-index:5;display:flex;flex-direction:column}.fullscreen header{height:58px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line)}.fullscreen iframe{width:100%;height:calc(100% - 58px);border:0;background:white}.ghost{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 13px}.status{color:var(--muted);font-size:13px;margin-top:13px}.danger{color:var(--danger)}@media(max-width:700px){.sidebar{width:72px;padding:18px 9px}.brand{justify-content:center;padding:0 0 24px}.brand>div:last-child,.nav span,.side-note{display:none}.nav button{justify-content:center;padding:13px}.topbar{padding:0 18px}.view{padding:28px 18px}.hero{margin-top:7vh}.hero h1{font-size:52px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bubble{max-width:90%}}
  </style>
</head>
<body>
  <div class="app"><aside class="sidebar"><div class="brand"><div class="mark"></div><div><strong>Nightfall</strong><small>Night Education</small></div></div><nav class="nav" aria-label="Primary"><button class="active" data-page="home"><svg viewBox="0 0 24 24"><path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><path d="M9 20v-6h6v6"/></svg><span>Home</span></button><button data-page="library"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5Z"/><path d="M4 5.5v16M8 7h8M8 11h8"/></svg><span>Lessons</span></button><button data-page="assistant"><svg viewBox="0 0 24 24"><path d="M12 3a8 8 0 0 0-8 8v3a3 3 0 0 0 3 3h2v-6H5a7 7 0 0 1 14 0h-4v6h2a3 3 0 0 0 3-3v-3a8 8 0 0 0-8-8Z"/><path d="M9 21h6"/></svg><span>AI Assistant</span></button><button data-page="web"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15.5 0 18M12 3c-2.5 2.5-2.5 15.5 0 18"/></svg><span>Web</span></button><button data-page="settings"><svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg><span>Settings</span></button></nav><div class="side-note">A quiet place to learn, explore, and focus.</div></aside><main class="main"><header class="topbar"><div class="crumb" id="crumb">Home / Overview</div><div class="clock" id="clock"></div></header><section class="view" id="view"></section></main></div><div id="overlay"></div>
<script>
const AI_ENDPOINT="",AI_KEY="",WISP_URL="";
const lessons=[
 {title:"Midnight Shift",cover:"./covers/midnight-shift.png",file:"./lessons/midnight-shift.html"},
 {title:"Moonbound",cover:"./covers/moonbound.png",file:"./lessons/moonbound.html"},
 {title:"Neon Drift",cover:"./covers/neon-drift.png",file:"./lessons/neon-drift.html"},
 {title:"Starfall",cover:"./covers/starfall.png",file:"./lessons/starfall.html"},
 {title:"Wordle",cover:"./covers/wordle.webp",file:"./lessons/wordle.html"},
 {title:"Void Puzzle",cover:"./covers/void-puzzle.png",file:"./lessons/void-puzzle.html"},
 {title:"Hex Garden",cover:"./covers/hex-garden.png",file:"./lessons/hex-garden.html"},
 {title:"Slow Roads",cover:"./covers/slow-roads.jpg",file:"./lessons/slow-roads.html"},
 {title:"Learn to Fly",cover:"./covers/learn-to-fly.png",file:"./lessons/learn-to-fly.html"},
 {title:"Paper 3D",cover:"./covers/paper3d.png",file:"./lessons/paper3d.html"},
 {title:"Tag",cover:"./covers/tag.png",file:"./lessons/tag.html"},
 {title:"Tiletopia",cover:"./covers/tiletopia.png",file:"./lessons/tiletopia.html"}
];
const view=document.querySelector('#view'),crumb=document.querySelector('#crumb'),fallback="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 450'%3E%3Crect width='600' height='450' fill='%23142b22'/%3E%3Cpath d='M0 370 180 230l100 80 90-120 230 180H0Z' fill='%232b684b'/%3E%3Ccircle cx='430' cy='120' r='48' fill='%239af6c0' opacity='.75'/%3E%3C/svg%3E";
function safeImage(e){e.currentTarget.onerror=null;e.currentTarget.src=fallback}
function shell(title,sub){crumb.textContent="Nightfall / "+title;return `<div class="section-head"><div><h2>${title}</h2><p>${sub}</p></div></div>`}
function home(){crumb.textContent="Home / Overview";view.innerHTML=`<div class="hero"><div class="eyebrow">Night Education</div><h1>Learn in the quiet.</h1><p>A focused browser space for curious minds. Find a lesson, ask an assistant, or open a web session.</p><div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 5 5"/></svg><input id="home-search" placeholder="Search lessons..." autocomplete="off"><button id="search-btn">Browse</button></div></div>`;document.querySelector('#search-btn').onclick=()=>library(document.querySelector('#home-search').value);document.querySelector('#home-search').onkeydown=e=>{if(e.key==='Enter')library(e.target.value)}}
function library(query=''){view.innerHTML=shell('Lessons','A small library for late-night curiosity.')+`<div class="search" style="margin:0 0 25px;max-width:none"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 5 5"/></svg><input id="library-search" value="${query.replaceAll('"','&quot;')}" placeholder="Filter lessons..." autocomplete="off"></div><div class="grid" id="grid"></div>`;const grid=document.querySelector('#grid');const draw=term=>{grid.innerHTML=lessons.filter(x=>x.title.toLowerCase().includes(term.toLowerCase())).map(x=>`<article class="card" data-file="${x.file}"><img loading="lazy" src="${x.cover}" alt="${x.title} cover" onerror="safeImage(event)"><div class="card-body"><div class="card-title">${x.title}</div><div class="card-meta">Open lesson</div></div></article>`).join('')||'<p class="status">No lessons found.</p>';grid.querySelectorAll('.card').forEach(c=>c.onclick=()=>openLesson(c.dataset.file,c.querySelector('.card-title').textContent))};draw(query);document.querySelector('#library-search').oninput=e=>draw(e.target.value)}
function openLesson(file,title){document.querySelector('#overlay').innerHTML=`<div class="fullscreen"><header><button class="ghost" id="back">← Back</button><strong>${title}</strong></header><iframe src="${file}" title="${title}" allowfullscreen></iframe></div>`;document.querySelector('#back').onclick=()=>document.querySelector('#overlay').innerHTML=''}
let chatMessages=[];function assistant(){view.innerHTML=shell('AI Assistant','Ask for a concise explanation, idea, or study plan.')+`<div class="chat"><div class="messages" id="messages"><div class="bubble ai">Hello. I can help you think through a topic.</div></div><div class="composer"><textarea class="field" id="chat-input" placeholder="Write a message..." rows="1"></textarea><button class="primary" id="send">Send</button></div><div class="status" id="chat-status">${AI_ENDPOINT?'Connected to your endpoint.':'Add an endpoint in the source to enable replies.'}</div></div>`;document.querySelector('#send').onclick=sendMessage;document.querySelector('#chat-input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.nativeEvent.isComposing){e.preventDefault();sendMessage()}}}
async function sendMessage(){const input=document.querySelector('#chat-input'),text=input.value.trim();if(!text)return;const messages=document.querySelector('#messages'),status=document.querySelector('#chat-status');messages.insertAdjacentHTML('beforeend',`<div class="bubble me"></div>`);messages.lastElementChild.textContent=text;input.value='';if(!AI_ENDPOINT){status.textContent='AI_ENDPOINT is empty. Add your compatible endpoint to connect.';return}chatMessages.push({role:'user',content:text});const bubble=document.createElement('div');bubble.className='bubble ai';bubble.textContent='Thinking...';messages.appendChild(bubble);try{const r=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json',...(AI_KEY?{Authorization:`Bearer ${AI_KEY}`}:{})},body:JSON.stringify({messages:chatMessages,stream:true})});if(!r.ok)throw new Error('Request failed');if(r.body){bubble.textContent='';const reader=r.body.getReader(),decoder=new TextDecoder();for(;;){const {value,done}=await reader.read();if(done)break;const chunk=decoder.decode(value);for(const line of chunk.split('\n')){if(line.startsWith('data: ')){const data=line.slice(6);if(data==='[DONE]')continue;try{const parsed=JSON.parse(data),delta=parsed.choices?.[0]?.delta?.content||parsed.choices?.[0]?.message?.content||'';bubble.textContent+=delta}catch{}}}}}chatMessages.push({role:'assistant',content:bubble.textContent})}catch(e){bubble.textContent='The assistant could not connect. Check the endpoint and permissions.';status.className='status danger'}}
function web(){view.innerHTML=shell('Web','Open a session through your configured relay.')+`<div class="form-panel"><label class="label" for="web-address">Address</label><div class="row"><input class="field" id="web-address" placeholder="https://example.com" style="flex:1;min-width:220px"><button class="primary" id="open-web">Open</button></div><div class="status" id="web-status">${WISP_URL?'Ready to connect.':'coming soon'}</div></div>`;document.querySelector('#open-web').onclick=()=>{const status=document.querySelector('#web-status');if(!WISP_URL){status.textContent='coming soon';return}if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});status.textContent='Session requested.'}}
function settings(){view.innerHTML=shell('Settings','Tune the shell to your preference.')+`<div class="form-panel"><label class="label" for="tab-title">Tab title</label><input class="field" id="tab-title" value="${document.title}"><label class="label" for="tab-icon" style="margin-top:18px">Favicon data URL</label><input class="field" id="tab-icon" placeholder="data:image/svg+xml,..."><div class="row" style="margin-top:18px"><button class="primary" id="save-settings">Save settings</button></div><p class="status">Panic key: press Escape twice quickly to open a harmless study page.</p></div>`;document.querySelector('#save-settings').onclick=()=>{document.title=document.querySelector('#tab-title').value||'Night Education';const icon=document.querySelector('#tab-icon').value.trim();if(icon)document.querySelector('#site-favicon').href=icon;document.querySelector('#save-settings').textContent='Saved'}}
function panic(){document.querySelector('#overlay').innerHTML=`<div class="fullscreen"><header><strong>Study Notes</strong><button class="ghost" id="close-panic" style="margin-left:auto">Close</button></header><div class="view"><div class="form-panel"><div class="eyebrow">Focus mode</div><h2>Notes for later</h2><p class="status">Take a breath, write down one next step, and return when you are ready.</p><textarea class="field" rows="8" placeholder="Your notes..."></textarea></div></div></div>`;document.querySelector('#close-panic').onclick=()=>document.querySelector('#overlay').innerHTML=''}
let escapeAt=0;document.addEventListener('keydown',e=>{if(e.key==='Escape'){const now=Date.now();if(now-escapeAt<650)panic();escapeAt=now}});document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');({home,library,assistant,web,settings}[b.dataset.page])()});setInterval(()=>document.querySelector('#clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),1000);home();
</script>
</body>
</html>
