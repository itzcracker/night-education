function safeImage(e){e.currentTarget.onerror=null;e.currentTarget.src=fallback}function shell(title,sub){document.querySelector('#crumb').textContent='Nightfall / '+title;return `<div class="section"><h1>${title}</h1><p class="muted">${sub}</p></div>`}function home(){view.innerHTML=`<div class="hero"><div class="script">nightfall</div><p class="muted">A quiet place to learn, explore, and focus.</p><div class="search"><input id="q" placeholder="Search lessons or the web" autofocus><button class="primary" id="go">Open</button></div></div>`;document.querySelector('#go').onclick=()=>routeSearch(document.querySelector('#q').value);document.querySelector('#q').onkeydown=e=>{if(e.key==='Enter')routeSearch(e.target.value)}}function routeSearch(q){const x=lessons.find(l=>l.title.toLowerCase()===q.trim().toLowerCase());x?openLesson(x):library(q)}function library(q=''){view.innerHTML=shell('Library','Browse every lesson in the Nightfall collection.')+`<div class="search"><input id="filter" value="${q.replaceAll('"','&quot;')}" placeholder="Filter lessons"></div><div class="grid" id="grid"></div>`;const draw=t=>{document.querySelector('#grid').innerHTML=lessons.filter(x=>x.title.toLowerCase().includes(t.toLowerCase())).map(x=>`<button class="card" data-slug="${x.slug}"><img loading="lazy" src="${x.cover}" alt="${x.title}" onerror="safeImage(event)"><b>${x.title}</b><span>Open lesson</span></button>`).join('')||'<p class="muted">No lessons found.</p>';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openLesson(lessons.find(x=>x.slug===c.dataset.slug)))};draw(q);document.querySelector('#filter').oninput=e=>draw(e.target.value)}function openLesson(x){overlay.classList.add('open');overlay.innerHTML=`<header><button class="back" id="back">← Back</button><b>${x.title}</b></header><iframe src="${x.file}" title="${x.title}" allowfullscreen></iframe>`;document.querySelector('#back').onclick=()=>overlay.classList.remove('open')}let activeAgent='dots-studio/dots-3-note-preview:free';function assistant(){view.innerHTML=shell('AI Agents','Choose a specialist, then ask anything.')+`<div class="agent-pills"><button class="primary" data-agent="dots-studio/dots-3-note-preview:free">Study guide</button><button class="nav-chip" data-agent="recursive/flint-v1.0:free">Code coach</button><button class="nav-chip" data-agent="poolside/laguna-s-2.1:free">Idea partner</button></div><div class="chat"><div class="messages" id="messages"><div class="bubble"><b>Nightfall agents online.</b><br><span class="muted">I can explain lessons, debug projects, or help you explore ideas.</span></div></div><div class="composer"><textarea class="field" id="chat" rows="1" placeholder="Ask your agent..."></textarea><button class="primary" id="send">Send</button></div></div>`;document.querySelectorAll('[data-agent]').forEach(b=>b.onclick=()=>{activeAgent=b.dataset.agent;document.querySelectorAll('[data-agent]').forEach(x=>x.classList.toggle('primary',x===b))});document.querySelector('#send').onclick=send;document.querySelector('#chat').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();send()}}}async function send(){const input=document.querySelector('#chat'),text=input.value.trim();if(!text)return;const box=document.querySelector('#messages');box.insertAdjacentHTML('beforeend',`<div class="bubble me"></div>`);box.lastElementChild.textContent=text;input.value='';const ai=document.createElement('div');ai.className='bubble';ai.textContent='Thinking…';box.appendChild(ai);try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:activeAgent,messages:[{role:'user',content:text}]})});const data=await r.json();ai.textContent=data.reply||data.error||'No response.'}catch{ai.textContent='The agent could not connect. Check your connection and try again.'}}function web(){view.innerHTML=shell('Web','Open a session through your configured relay.')+`<div class="panel"><div class="row"><input class="field" id="address" placeholder="Address"><button class="primary" id="open">Open</button></div><p class="muted" id="status">${WISP_URL?'Ready to connect.':'coming soon'}</p></div>`;document.querySelector('#open').onclick=()=>{if(!WISP_URL)return;if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');document.querySelector('#status').textContent='Session requested.'}}function settings(){view.innerHTML=shell('Settings','Personalize the shell.')+`<div class="panel"><label>Tab title<input class="field" id="title" value="${document.title}"></label><button class="primary" id="save" style="margin-top:16px">Save</button><p class="muted">Panic key: press Escape twice quickly to open a harmless study page.</p></div>`;document.querySelector('#save').onclick=()=>{document.title=document.querySelector('#title').value||'Nightfall'}}function panic(){overlay.classList.add('open');overlay.innerHTML='<header><b>Study Notes</b><button class="back" id="close">Close</button></header><div class="view"><div class="panel"><h1>Focus mode</h1><p class="muted">Take a breath and write one next step.</p><textarea class="field" rows="8"></textarea></div></div>';document.querySelector('#close').onclick=()=>overlay.classList.remove('open')}let lastEscape=0;document.addEventListener('keydown',e=>{if(e.key==='Escape'){const n=Date.now();if(n-lastEscape<650)panic();lastEscape=n}});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-page]').forEach(x=>x.classList.remove('active'));b.classList.add('active');({home,library,assistant,web,settings}[b.dataset.page])()});home();
</script></body></html>
