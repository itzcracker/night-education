<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nightfall</title><style>:root{color-scheme:dark;--bg:#0f0e14;--panel:#18161f;--line:#393341;--muted:#96929e;--text:#f4f1f7;--purple:#dca9f4}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.app{min-height:100vh;position:relative;overflow:hidden}.app:before{content:"";position:fixed;inset:40% -10% -20%;background:radial-gradient(ellipse,#66376f 0,rgba(102,55,111,.5) 30%,transparent 68%);filter:blur(70px);pointer-events:none;z-index:-1}.nav{position:fixed;z-index:5;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:6px 9px;border:1px solid #3b3442;border-radius:30px;background:#15131aee;backdrop-filter:blur(18px)}.nav button{border:0;border-radius:20px;padding:8px 12px;background:transparent;color:#9c98a5}.nav button.active{color:#f5edf8;box-shadow:0 2px var(--purple)}.main{min-height:100vh;padding:86px 5vw 30px}.home{min-height:82vh;display:flex;flex-direction:column;justify-content:center;align-items:center}.logo{font-size:50px;letter-spacing:-.07em;margin-bottom:20px}.search{width:min(640px,100%);border:1px solid #3e3648;border-radius:28px;background:#1a1821;padding:15px 18px;outline:0}.search:focus{border-color:var(--purple);box-shadow:0 0 0 3px #dca9f420}.bookmarks{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;justify-content:center}.chip,.ghost{border:1px solid #36313d;border-radius:20px;background:#191720;padding:8px 13px;color:#a9a4b0}.chip:hover,.ghost:hover{border-color:#8f659d}.section{max-width:1100px;margin:auto}.section h1{font-size:34px}.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0}.toolbar .search{flex:1;padding:10px 15px}.ghost{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.game{position:relative;padding:0;border:1px solid #302c36;border-radius:13px;overflow:hidden;background:#19171e;aspect-ratio:1}.game img{display:block;width:100%;height:100%;object-fit:cover}.game span{position:absolute;inset:auto 5px 5px;padding:5px 6px;border-radius:6px;background:#08070acc;opacity:0;transition:.2s;font-size:11px}.game:hover span,.game:focus span{opacity:1}.screen{position:fixed;inset:0;z-index:10;background:#08070b}.screen iframe{width:100%;height:100%;border:0}.screenbar{position:absolute;z-index:2;left:15px;top:15px;display:flex;gap:7px}.screenbar button{border:1px solid #4a4350;border-radius:20px;background:#18151dcc;padding:8px 12px}.ai-layout{display:grid;grid-template-columns:220px minmax(0,680px);gap:40px;justify-content:center;align-items:start;padding-top:8vh}.sidebar{border:1px solid #302b37;border-radius:12px;background:#15131b;padding:14px}.sidebar h2{margin:0 0 14px}.sidebar button{width:100%;border:0;border-radius:8px;background:#25202b;padding:10px;text-align:left}.sidebar p{color:var(--muted);font-size:12px}.chat{min-height:550px;display:flex;flex-direction:column}.chat h1{text-align:center;font-size:38px;margin:45px 0 25px}.messages{flex:1;overflow:auto}.bubble{max-width:85%;margin:8px 0;padding:10px 13px;border-radius:12px;background:#211d28;white-space:pre-wrap}.bubble.you{margin-left:auto;background:#4d3561}.composer{display:flex;gap:8px;border:1px solid #3d3544;border-radius:18px;padding:8px;background:#191720}.composer input{min-width:0;flex:1;border:0;background:transparent;outline:0;padding:9px}.composer button{border:0;border-radius:14px;padding:8px 14px;background:var(--purple);color:#211426}.models{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.models button{border:1px solid #393341;border-radius:14px;background:#191720;padding:6px 9px;font-size:11px}.models .active{border-color:var(--purple);color:var(--purple)}.settings{max-width:760px;margin:35px auto}.settings h1{font-size:36px}.group{margin:28px 0}.group h3{font-size:11px;color:#aaa1b0;text-transform:uppercase;letter-spacing:.13em}.card{border:1px solid #37313d;border-radius:15px;background:#18161e;padding:5px 20px}.row{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid #2b2630}.row:last-child{border:0}.row small{display:block;color:var(--muted);margin-top:3px}.row input,.row select{background:#24202b;border:1px solid #43394c;border-radius:8px;padding:9px;max-width:260px}.switch{appearance:none;width:40px;height:22px;border-radius:20px;background:#35303b;position:relative}.switch:checked{background:#9e6eac}.switch:after{content:"";position:absolute;width:16px;height:16px;top:3px;left:3px;border-radius:50%;background:#c7b7cb;transition:.2s}.switch:checked:after{left:21px}.clear{color:#f0a4ae;background:transparent;border:0}.no-aurora .app:before{display:none}.toast{position:fixed;right:16px;bottom:16px;color:#aaa;font-size:12px}@media(max-width:950px){.grid{grid-template-columns:repeat(5,1fr)}}@media(max-width:680px){.nav{width:calc(100% - 24px);justify-content:space-around}.nav button{padding:8px}.main{padding:76px 15px 20px}.grid{grid-template-columns:repeat(3,1fr)}.ai-layout{grid-template-columns:1fr;gap:15px}.sidebar{display:none}.chat h1{font-size:30px}.row{align-items:flex-start;flex-direction:column;padding:13px 0;gap:8px}}
</style></head><body><div class="app"><nav class="nav"><button data-page="home" class="active">◉&nbsp; Home</button><button data-page="games">▣&nbsp; Games</button><button data-page="ai">✦&nbsp; AI</button><button data-page="settings">⚙&nbsp; Settings</button></nav><main class="main" id="root"></main><div class="toast" id="toast"></div></div><script>
const MODELS=['recursive/flint-v1.0:free','dots-studio/dots-3-note-preview:free','liquid/lfm-2.5-2.6b:free','nvidia/nemotron-3.5-super-vl:free'];const NAMES={'recursive/flint-v1.0:free':'Flint','dots-studio/dots-3-note-preview:free':'Dots','liquid/lfm-2.5-2.6b:free':'Liquid','nvidia/nemotron-3.5-super-vl:free':'Nemotron'};const S={page:'home',games:[],model:MODELS[0],messages:[],settings:{bg:localStorage.getItem('nightfall_bg')!=='0',engine:localStorage.getItem('nightfall_engine')||'DuckDuckGo',disguise:localStorage.getItem('nightfall_disguise')||'None',exitKey:localStorage.getItem('nightfall_exit')||'`',destination:localStorage.getItem('nightfall_destination')||'https://docs.google.com/document/u/0/',confirm:localStorage.getItem('nightfall_confirm')==='1'}};const root=document.querySelector('#root');function save(k,v){localStorage.setItem(k,v)}function toast(v){document.querySelector('#toast').textContent=v;setTimeout(()=>document.querySelector('#toast').textContent='',2500)}function openWeb(query){toast('Web search proxy placeholder: '+query)}function render(){document.body.classList.toggle('no-aurora',!S.settings.bg);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===S.page));root.innerHTML=S.page==='home'?home():S.page==='games'?games():S.page==='ai'?ai():settings();if(S.page==='games')bindGames();if(S.page==='ai')bindAI();if(S.page==='settings')bindSettings()}function home(){return '<section class="home"><div class="logo">Nightfall</div><form id="home-search" class="search"><input id="home-q" style="width:calc(100% - 30px);border:0;background:transparent;outline:0" placeholder="Search anything!"><button style="float:right;background:transparent;border:0">↑</button></form><div class="bookmarks"><button class="chip" onclick="openWeb(\'TikTok\')">◉ TikTok</button><button class="chip" onclick="openWeb(\'Spotify\')">● Spotify</button><button class="chip" onclick="addBookmark()">＋ Add bookmark</button></div></section>'}function addBookmark(){const name=prompt('Bookmark name');if(name){const url=prompt('Bookmark URL');const list=JSON.parse(localStorage.getItem('nightfall_bookmarks')||'[]');list.push({name,url});localStorage.setItem('nightfall_bookmarks',JSON.stringify(list));toast('Bookmark saved');render()}}function games(){return '<section class="section"><div class="toolbar"><input class="search" id="game-q" placeholder="Search games"><button class="ghost" id="fav">☆ Favorites</button><button class="ghost" id="random">↝ Random</button></div><div class="grid">'+S.games.map((g,i)=>'<button class="game" data-game="'+i+'"><img src="'+g.cover+'" alt=""><span>'+g.title+'</span></button>').join('')+'</div></section>'}function bindGames(){const filter=()=>{const q=document.querySelector('#game-q').value.toLowerCase();document.querySelectorAll('.game').forEach(b=>b.style.display=S.games[+b.dataset.game].title.toLowerCase().includes(q)?'block':'none')};document.querySelector('#game-q').oninput=filter;document.querySelector('#random').onclick=()=>openGame(Math.floor(Math.random()*S.games.length));document.querySelector('#fav').onclick=()=>toast('Favorites are ready for your next save');document.querySelectorAll('.game').forEach(b=>b.onclick=()=>openGame(+b.dataset.game))}function openGame(i){const g=S.games[i];const screen=document.createElement('div');screen.className='screen';screen.innerHTML='<div class="screenbar"><button id="back">← Back</button><button id="full">Fullscreen</button><button id="star">☆ Favorite</button></div><iframe src="'+g.url+'" title="'+g.title+'"></iframe>';document.body.append(screen);screen.querySelector('#back').onclick=()=>screen.remove();screen.querySelector('#full').onclick=()=>screen.requestFullscreen?.();screen.querySelector('#star').onclick=e=>{e.target.textContent='★ Favorited';save('nightfall_favorite_'+g.title,'1')}}function ai(){return '<section class="ai-layout"><aside class="sidebar"><h2>✦ Nightfall</h2><button>＋ New chat</button><p>⌕ Search chats</p><p>RECENT</p><p>Tokens today&nbsp; —</p></aside><section class="chat"><h1>What’s on your mind?</h1><div class="models">'+MODELS.map(m=>'<button data-model="'+m+'" class="'+(S.model===m?'active':'')+'">'+NAMES[m]+'</button>').join('')+'</div><div class="messages" id="messages">'+S.messages.map(m=>'<div class="bubble '+m.role+'">'+m.content+'</div>').join('')+'</div><form id="chat-form" class="composer"><input id="prompt" placeholder="Ask anything..." autocomplete="off"><button>↑</button></form></section></section>'}function bindAI(){document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{S.model=b.dataset.model;render()});document.querySelector('#chat-form').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('#prompt'),text=input.value.trim();if(!text)return;S.messages.push({role:'you',content:text});render();const box=document.querySelector('#messages'),answer=document.createElement('div');answer.className='bubble';answer.textContent='Thinking...';box.append(answer);try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:S.model,messages:S.messages.map(m=>({role:m.role==='you'?'user':m.role,content:m.content}))})});if(!r.ok)throw new Error((await r.json()).error||'AI unavailable');const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='',raw='';while(true){const x=await reader.read();if(x.done)break;buffer+=decoder.decode(x.value,{stream:true});const lines=buffer.split('\n');buffer=lines.pop()||'';for(const line of lines){if(!line.startsWith('data: ')||line.includes('[DONE]'))continue;try{const d=JSON.parse(line.slice(6));if(d.token){raw+=d.token;answer.textContent=raw;box.scrollTop=box.scrollHeight}}catch{}}}S.messages.push({role:'assistant',content:raw})}catch(err){answer.textContent=err.message}}}function settings(){return '<section class="settings"><h1>Settings</h1><p style="color:var(--muted)">Browser preferences and privacy controls.</p><div class="group"><h3>General</h3><div class="card"><div class="row"><div>Appearance</div><select><option>Dark</option></select></div><div class="row"><div>Animated background<small>Show Aurora on dark Home.</small></div><input class="switch" id="bg" type="checkbox" '+(S.settings.bg?'checked':'')+'></div><div class="row"><div>Search engine</div><select id="engine"><option>DuckDuckGo</option><option>Google</option><option>Brave</option></select></div><div class="row"><div>Block ads<small>Use filtered DNS for websites.</small></div><input class="switch" type="checkbox" checked></div></div></div><div class="group"><h3>Privacy & shortcuts</h3><div class="card"><div class="row"><div>Tab disguise</div><select id="disguise"><option>None</option><option>Google Docs</option><option>Google Classroom</option><option>Google Drive</option></select></div><div class="row"><div>Quick exit key<small>Works when you are not typing.</small></div><input id="exit" value="'+S.settings.exitKey+'"></div><div class="row"><div>Quick exit destination</div><input id="destination" value="'+S.settings.destination+'"></div><div class="row"><div>Confirm before leaving</div><input class="switch" id="confirm" type="checkbox" '+(S.settings.confirm?'checked':'')+'></div></div></div><div class="group"><h3>Data</h3><div class="card"><div class="row"><div>Local data<small>Bookmarks, preferences, tabs, and AI chats.</small></div><button class="clear" id="clear">Clear data</button></div></div></div></section>'}function bindSettings(){document.querySelector('#bg').onchange=e=>{S.settings.bg=e.target.checked;save('nightfall_bg',e.target.checked?'1':'0');document.body.classList.toggle('no-aurora',!e.target.checked)};document.querySelector('#engine').value=S.settings.engine;document.querySelector('#engine').onchange=e=>{S.settings.engine=e.target.value;save('nightfall_engine',e.target.value)};document.querySelector('#disguise').value=S.settings.disguise;document.querySelector('#disguise').onchange=e=>{S.settings.disguise=e.target.value;save('nightfall_disguise',e.target.value);document.title=e.target.value==='None'?'Nightfall':e.target.value;let icon=document.querySelector('link[rel="icon"]');if(!icon){icon=document.createElement('link');icon.rel='icon';document.head.append(icon)}icon.href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%2318161e"/><text x="50" y="66" text-anchor="middle" font-size="58" fill="%23dca9f4">'+(e.target.value==='None'?'N':'G')+'</text></svg>';toast('Tab disguise saved')};['exit','destination'].forEach(id=>document.querySelector('#'+id).onchange=e=>{S.settings[id==='exit'?'exitKey':'destination']=e.target.value;save(id==='exit'?'nightfall_exit':'nightfall_destination',e.target.value)});document.querySelector('#confirm').onchange=e=>{S.settings.confirm=e.target.checked;save('nightfall_confirm',e.target.checked?'1':'0')};document.querySelector('#clear').onclick=()=>{localStorage.clear();location.reload()}}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{S.page=b.dataset.page;render()});fetch('zones.json').then(r=>r.json()).then(z=>{S.games=z.map(g=>({title:g.title||g.name,cover:g.cover.replace('{COVER_URL}','covers'),url:g.url.replace('{HTML_URL}','games')}));render()}).catch(()=>fetch('games.json').then(r=>r.json()).then(g=>{S.games=g.map(x=>({title:x.title,cover:'covers/'+x.cover,url:'games/'+x.slug+'.html'}));render()}));render();
</script></body></html>
